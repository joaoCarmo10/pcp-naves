; PCP Naves - sincronização do PC da fábrica. Este arquivo fica SÓ neste PC: não mande por e-mail nem chat.
; O instalar.bat copia este exemplo para pcp_sync.ini e abre no Bloco de Notas para você preencher.

[app]
url = https://pcp-pfe.up.railway.app
; gere em: Importar dados > Plannix automático > Gerar token (o mesmo token vale para Autodoc e Plannix)
token =

[geral]
; só roda nesse intervalo de horas (de hora em hora). Fora dele, o agendador chama e o script sai sem fazer nada.
hora_inicio = 6
hora_fim = 20
; seg-sab (não roda domingo) ou todos
dias = seg-sab

[autodoc]
; usuário do Autodoc que enxerga a pasta 1-OBRAS ATIVAS. Ideal: um usuário só para isso, sem verificação em duas etapas.
; A senha só é usada no primeiro acesso; depois o script renova o acesso sozinho. Deixe o e-mail vazio para desligar.
email =
senha =

[plannix]
; modo = pasta     -> manda as exportações do Plannix (all_data / a_realizar) que caírem na pasta abaixo
; modo = sql       -> lê direto o banco do Plannix (precisa da consulta.sql; rode "descobrir" primeiro)
; modo = desligado
modo = pasta
pasta = %USERPROFILE%\Downloads
arquivos = all_data*.xls, *a_realizar*.xls

; só para modo = sql
servidor =
banco =
usuario =
senha =
timeout_consulta = 120
