<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | PCP Naves</title>
<link rel="stylesheet" href="/static/app.css?v={{ VERSAO_CSS }}"></head>
<body class="sem-menu">
<form class="login" method="post" action="/login">
  <h1>PCP Naves</h1>
  {% if erro %}<div class="aviso erro">{{ erro }}</div>{% endif %}
  <label for="usuario">Usuário<input id="usuario" name="usuario" value="{{ usuario or '' }}" autocomplete="username" autocapitalize="none" autofocus></label>
  <label for="senha">Senha<input id="senha" type="password" name="senha" autocomplete="current-password" required></label>
  <p><button type="submit" style="width:100%">Entrar</button></p>
</form>
</body>
</html>
